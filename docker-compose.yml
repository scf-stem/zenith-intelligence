services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      FLASK_ENV: "${FLASK_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/backend/data/app.db}"
      JWT_SECRET: "${JWT_SECRET:-change-me}"
      CHATGLM_API_KEY: "${CHATGLM_API_KEY:-}"
      MULTIMODAL_API_KEY: "${MULTIMODAL_API_KEY:-}"
      MULTIMODAL_API_URL: "${MULTIMODAL_API_URL:-https://open.bigmodel.cn/api/paas/v4/chat/completions}"
      MULTIMODAL_MODEL: "${MULTIMODAL_MODEL:-glm-4.6v-flashx}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      MINIMAX_API_URL: "${MINIMAX_API_URL:-https://api.minimaxi.com/v1/chat/completions}"
      MINIMAX_MODEL: "${MINIMAX_MODEL:-MiniMax-M2.7-highspeed}"
      DEFAULT_MODEL_PROVIDER: "${DEFAULT_MODEL_PROVIDER:-minimax}"
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    volumes:
      - app-data:/app/backend/data

volumes:
  app-data:
