<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Intelligence - 站长统计</title>
    <script src="env.js"></script>
    <script src="js/analytics.js" defer></script>
    <script src="js/site-i18n.js" defer></script>
    <style>
        :root {
            --bg: #0b1120;
            --panel: #111827;
            --panel-soft: #172033;
            --border: #243047;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --green: #34d399;
            --yellow: #fbbf24;
            --red: #fb7185;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 48px;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            letter-spacing: 0;
        }

        .header p {
            margin: 0;
            color: var(--muted);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select,
        button {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            min-height: 40px;
            padding: 0 12px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            background: #0ea5e9;
            border-color: #0ea5e9;
            font-weight: 700;
        }

        .grid {
            display: grid;
            gap: 16px;
        }

        .metrics {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin-bottom: 16px;
        }

        .two-col {
            grid-template-columns: 1.25fr 0.75fr;
            margin-bottom: 16px;
        }

        .three-col {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .panel {
            background: linear-gradient(180deg, rgba(23, 32, 51, 0.96), rgba(17, 24, 39, 0.96));
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
        }

        .metric-label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .metric-value {
            font-size: 34px;
            font-weight: 800;
            line-height: 1;
        }

        .metric-note {
            margin-top: 10px;
            color: var(--muted);
            font-size: 12px;
        }

        .panel h2 {
            margin: 0;
            font-size: 17px;
        }

        .section-help {
            margin: 6px 0 16px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .trend {
            display: grid;
            grid-template-columns: repeat(var(--days), minmax(6px, 1fr));
            align-items: end;
            gap: 5px;
            min-height: 240px;
            padding-top: 12px;
            border-bottom: 1px solid var(--border);
        }

        .bar {
            min-height: 4px;
            border-radius: 5px 5px 0 0;
            background: linear-gradient(180deg, var(--primary), #2563eb);
            position: relative;
        }

        .bar:hover::after {
            content: attr(data-label);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text);
            font-size: 12px;
            z-index: 2;
        }

        .list {
            display: grid;
            gap: 10px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }

        .row:last-child {
            border-bottom: none;
        }

        .row-main {
            min-width: 0;
        }

        .row-title {
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row-sub {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .pill {
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 999px;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
            padding: 4px 8px;
            font-size: 12px;
        }

        .feedback-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .feedback-toolbar h2 {
            margin: 0;
        }

        .feedback-list {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .feedback-item {
            display: grid;
            gap: 10px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }

        .feedback-item:last-child {
            border-bottom: none;
        }

        .feedback-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .feedback-content {
            color: #e2e8f0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .feedback-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .feedback-status {
            background: var(--panel);
            min-height: 32px;
            padding: 0 8px;
            font-size: 12px;
        }

        .empty {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 8px;
        }

        .error {
            color: var(--red);
        }

        @media (max-width: 900px) {
            .metrics,
            .two-col,
            .three-col {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
            }

            .controls {
                width: 100%;
            }

            select,
            button {
                flex: 1;
            }

            .feedback-toolbar {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="header">
            <div>
                <h1>站长统计</h1>
                <p id="status-text">读取本项目内置轻量统计数据</p>
            </div>
            <div class="controls">
                <select id="days-select" aria-label="统计周期">
                    <option value="7">最近 7 天</option>
                    <option value="30" selected>最近 30 天</option>
                    <option value="90">最近 90 天</option>
                </select>
                <button type="button" id="refresh-btn">刷新</button>
            </div>
        </header>

        <section class="grid metrics">
            <div class="panel">
                <div class="metric-label">页面浏览量</div>
                <div class="metric-value" id="metric-pv">0</div>
                <div class="metric-note">页面访问次数</div>
            </div>
            <div class="panel">
                <div class="metric-label">独立访客数</div>
                <div class="metric-value" id="metric-uv">0</div>
                <div class="metric-note">按匿名访客 ID 去重</div>
            </div>
            <div class="panel">
                <div class="metric-label">自定义事件</div>
                <div class="metric-value" id="metric-events">0</div>
                <div class="metric-note">登录、注册、反馈等事件</div>
            </div>
            <div class="panel">
                <div class="metric-label">平均停留</div>
                <div class="metric-value" id="metric-duration">0s</div>
                <div class="metric-note">页面关闭或跳转时上报</div>
            </div>
        </section>

        <section class="grid two-col">
            <div class="panel">
                <h2>访问趋势</h2>
                <div class="trend" id="trend-chart" style="--days: 30;"></div>
            </div>
            <div class="panel">
                <h2>来源渠道</h2>
                <div class="list" id="referrer-list"></div>
            </div>
        </section>

        <section class="grid three-col">
            <div class="panel">
                <h2>页面访问排行</h2>
                <p class="section-help">查看哪些页面被访问最多，以及每页的访客和停留情况。</p>
                <div class="list" id="page-list"></div>
            </div>
            <div class="panel">
                <h2>用户操作统计</h2>
                <p class="section-help">统计用户完成的关键操作，例如注册、登录和反馈提交。</p>
                <div class="list" id="event-list"></div>
            </div>
            <div class="panel">
                <h2>最近访客记录</h2>
                <p class="section-help">按时间查看最近访问的页面和本次停留时长。</p>
                <div class="list" id="recent-list"></div>
            </div>
        </section>

        <section class="panel" style="margin-top: 16px;">
            <div class="feedback-toolbar">
                <h2>用户反馈</h2>
                <div class="controls">
                    <select id="feedback-status-filter" aria-label="反馈状态">
                        <option value="">全部状态</option>
                        <option value="open">待处理</option>
                        <option value="reviewing">处理中</option>
                        <option value="resolved">已解决</option>
                        <option value="archived">已归档</option>
                    </select>
                    <button type="button" id="feedback-refresh-btn">刷新反馈</button>
                </div>
            </div>
            <div class="feedback-list" id="feedback-list">
                <div class="empty">正在读取反馈...</div>
            </div>
        </section>
    </main>

    <script src="js/user.js?v=4"></script>
    <script src="js/site-header.js" defer></script>

    <script>
        function isLocalhost() {
            return window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        }

        function apiBase() {
            if (window.__env__ && window.__env__.VITE_API_BASE_URL) {
                return window.__env__.VITE_API_BASE_URL;
            }
            return isLocalhost() ? 'http://localhost:5001' : '';
        }

        function formatNumber(value) {
            return Number(value || 0).toLocaleString('zh-CN');
        }

        function formatDuration(seconds) {
            const value = Number(seconds || 0);
            if (value < 60) return `${value}s`;
            const minutes = Math.floor(value / 60);
            const rest = value % 60;
            return `${minutes}m ${rest}s`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function setRows(containerId, rows, renderRow, emptyText) {
            const container = document.getElementById(containerId);
            if (!rows.length) {
                container.innerHTML = `<div class="empty">${emptyText}</div>`;
                return;
            }
            container.innerHTML = rows.map(renderRow).join('');
        }

        const feedbackCategoryLabels = {
            general: '一般反馈',
            bug: '问题反馈',
            feature: '功能建议',
            account: '账号相关',
            content: '内容建议'
        };

        const feedbackStatusLabels = {
            open: '待处理',
            reviewing: '处理中',
            resolved: '已解决',
            archived: '已归档'
        };

        const pageLabels = {
            '/': '首页',
            '/index.html': '首页',
            '/app.html': '智能解题页',
            '/dashboard.html': '站长统计页',
            '/courses.html': '课程中心',
            '/learning.html': '学习界面',
            '/stats.html': '学习统计页',
            '/profile.html': '个人中心',
            '/programming.html': '编程助手'
        };

        const eventLabels = {
            feedback_open: '打开反馈窗口',
            feedback_submit_success: '提交反馈成功',
            feedback_submit_error: '提交反馈失败',
            feedback_status_update: '更新反馈状态',
            login_success: '登录成功',
            register_success: '注册成功',
            manual_test: '手动测试事件'
        };

        function displayPage(path) {
            return pageLabels[path] || path || '未知页面';
        }

        function displayEvent(eventName) {
            return eventLabels[eventName] || eventName || '未知操作';
        }

        function renderTrend(trend) {
            const chart = document.getElementById('trend-chart');
            chart.style.setProperty('--days', trend.length || 1);
            const maxPv = Math.max(1, ...trend.map(item => item.pv));
            chart.innerHTML = trend.map(item => {
                const height = Math.max(4, Math.round((item.pv / maxPv) * 220));
                return `<div class="bar" style="height:${height}px" data-label="${item.date} · 浏览量 ${item.pv} · 访客 ${item.uv}"></div>`;
            }).join('');
        }

        async function loadAnalytics() {
            const days = document.getElementById('days-select').value;
            const status = document.getElementById('status-text');
            status.textContent = '正在读取统计数据...';
            status.classList.remove('error');

            try {
                const response = await fetch(`${apiBase()}/api/site-analytics/summary?days=${days}`);
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || '读取统计数据失败');
                }

                const data = result.data;
                document.getElementById('metric-pv').textContent = formatNumber(data.overview.pv);
                document.getElementById('metric-uv').textContent = formatNumber(data.overview.uv);
                document.getElementById('metric-events').textContent = formatNumber(data.overview.events);
                document.getElementById('metric-duration').textContent = formatDuration(data.overview.avgDuration);

                renderTrend(data.trend);
                setRows('referrer-list', data.referrers, item => `
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title">${escapeHtml(item.source)}</div>
                            <div class="row-sub">访问来源</div>
                        </div>
                        <span class="pill">${formatNumber(item.count)}</span>
                    </div>
                `, '暂无来源数据');

                setRows('page-list', data.pages, item => `
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title">${escapeHtml(displayPage(item.path))}</div>
                            <div class="row-sub">${escapeHtml(item.path)} · 访客 ${formatNumber(item.uv)} · 平均停留 ${formatDuration(item.avgDuration)}</div>
                        </div>
                        <span class="pill">浏览量 ${formatNumber(item.pv)}</span>
                    </div>
                `, '暂无页面数据');

                setRows('event-list', data.events, item => `
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title">${escapeHtml(displayEvent(item.eventName))}</div>
                            <div class="row-sub">事件代码：${escapeHtml(item.eventName)}</div>
                        </div>
                        <span class="pill">${formatNumber(item.count)}</span>
                    </div>
                `, '暂无事件数据');

                setRows('recent-list', data.recentVisits, item => `
                    <div class="row">
                        <div class="row-main">
                            <div class="row-title">${escapeHtml(displayPage(item.path))}</div>
                            <div class="row-sub">${escapeHtml(item.path)} · ${new Date(item.createdAt).toLocaleString('zh-CN')}</div>
                        </div>
                        <span class="pill">${formatDuration(item.duration)}</span>
                    </div>
                `, '暂无最近访问');

                status.textContent = `已更新 · 最近 ${days} 天`;
            } catch (error) {
                status.textContent = error.message || '读取统计数据失败';
                status.classList.add('error');
            }
        }

        document.getElementById('refresh-btn').addEventListener('click', loadAnalytics);
        document.getElementById('days-select').addEventListener('change', loadAnalytics);
        loadAnalytics();

        async function loadFeedback() {
            const list = document.getElementById('feedback-list');
            const status = document.getElementById('feedback-status-filter').value;
            list.innerHTML = '<div class="empty">正在读取反馈...</div>';

            if (typeof UserManager === 'undefined' || !UserManager.getToken()) {
                list.innerHTML = '<div class="empty">需要先登录后才能查看反馈。请从首页登录后再打开本页。</div>';
                return;
            }

            try {
                const query = new URLSearchParams({ page: '1', perPage: '50' });
                if (status) {
                    query.set('status', status);
                }

                const response = await UserManager.fetchApi(`/api/feedback?${query.toString()}`);
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || '读取反馈失败');
                }

                const records = result.data.records;
                if (!records.length) {
                    list.innerHTML = '<div class="empty">当前没有符合条件的反馈</div>';
                    return;
                }

                list.innerHTML = records.map(record => `
                    <article class="feedback-item" data-feedback-id="${escapeHtml(record.id)}">
                        <div class="feedback-topline">
                            <span class="pill">${escapeHtml(feedbackCategoryLabels[record.category] || record.category)}</span>
                            <select class="feedback-status" data-feedback-status="${escapeHtml(record.id)}">
                                ${Object.entries(feedbackStatusLabels).map(([value, label]) => `
                                    <option value="${value}" ${record.status === value ? 'selected' : ''}>${label}</option>
                                `).join('')}
                            </select>
                        </div>
                        <div class="feedback-content">${escapeHtml(record.content)}</div>
                        <div class="feedback-meta">
                            <span>${new Date(record.createdAt).toLocaleString('zh-CN')}</span>
                            <span>页面：${escapeHtml(record.pageUrl || '-')}</span>
                            <span>联系：${escapeHtml(record.contact || '未填写')}</span>
                            <span>用户：${escapeHtml(record.username || '匿名')}</span>
                        </div>
                    </article>
                `).join('');

                list.querySelectorAll('[data-feedback-status]').forEach(select => {
                    select.addEventListener('change', async () => {
                        await updateFeedbackStatus(select.dataset.feedbackStatus, select.value, select);
                    });
                });
            } catch (error) {
                list.innerHTML = `<div class="empty error">${escapeHtml(error.message || '读取反馈失败')}</div>`;
            }
        }

        async function updateFeedbackStatus(feedbackId, status, select) {
            select.disabled = true;
            try {
                const response = await UserManager.fetchApi(`/api/feedback/${encodeURIComponent(feedbackId)}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || '更新状态失败');
                }
                if (window.ZenithAnalytics) {
                    window.ZenithAnalytics.track('feedback_status_update', { status });
                }
            } catch (error) {
                alert(error.message || '更新状态失败');
                await loadFeedback();
            } finally {
                select.disabled = false;
            }
        }

        document.getElementById('feedback-refresh-btn').addEventListener('click', loadFeedback);
        document.getElementById('feedback-status-filter').addEventListener('change', loadFeedback);
        loadFeedback();
    </script>
</body>

</html>
